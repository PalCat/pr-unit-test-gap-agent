name: coverage-gate

on:
  pull_request:
    branches: [main]
    paths: ["src/**", "tests/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check coverage of changed lines
        id: gate
        env:
          COVERAGE_THRESHOLD: "80"
        run: |
          set +e
          bash scripts/check_gap.sh "origin/${{ github.base_ref }}"
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
          exit 0

      - name: Comment result on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const gap = '${{ steps.gate.outputs.gap }}' === 'true';
            const marker = '<!-- coverage-gate -->';
            const report = fs.existsSync('diff-cover.md') ? fs.readFileSync('diff-cover.md', 'utf8') : '';
            const headline = gap
              ? '### Coverage gate: changed lines are under-tested'
              : '### Coverage gate: changed lines are covered';
            const body = `${marker}\n${headline}\n\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if gap (Phase 2 only; the agent step replaces this later)
        if: steps.gate.outputs.gap == 'true'
        run: |
          echo "Changed lines are below the coverage threshold."
          exit 1
